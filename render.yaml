services:
  - type: web
    name: nilm-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nilm-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MQTT_ENABLED
        value: "false"
      - key: MQTT_BROKER_HOST
        sync: false
      - key: MQTT_BROKER_PORT
        value: "1883"

  - type: web
    name: nilm-dashboard
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://nilm-backend.onrender.com

databases:
  - name: nilm-database
    plan: free
